# ================================
# Entity Plugin Configuration
# ================================

haunt:
  enabled: true
  auto-start-on-join: true
  first-haunt-delay: 120
  min-interval: 60
  max-interval: 600

entity:
  damage: 2.0
  flash-duration: 15
  spawn-distance: 4.0
  no-loot-on-death: true
  skin:
    value: ""          # Base64 texture value for Herobrine skin (derived from provided URL)
    signature: ""      # Optional Mojang signature for the texture

messages:
  haunt-title: "&4&lI am watching you"
  haunt-subtitle: ""
  forced-haunt: "&6Haunt forced on %player%"
  haunt-stopped: "&aHaunting stopped for %player%"
  haunt-started: "&aHaunting resumed for %player%"

sounds:
  enabled: true
  ambient: "ENTITY_WITHER_AMBIENT"
  attack: "ENTITY_PLAYER_HURT"
  disappear: "ENTITY_ENDERMAN_TELEPORT"
  appear: "BLOCK_PORTAL_TRIGGER"
  curse: "ENTITY_ELDER_GUARDIAN_CURSE"
  volume: 1.0
  pitch: 0.8

particles:
  enabled: true
  spawn:
    type: "SMOKE_NORMAL"
    count: 20
  despawn:
    type: "LARGE_SMOKE"
    count: 15
